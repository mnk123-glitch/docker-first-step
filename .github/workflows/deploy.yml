name: Build and Push to Docker Hub

# 1. Trigger this workflow every time code is pushed to the 'main' branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-ship:
    runs-on: ubuntu-latest # The cloud computer GitHub gives you for free

    steps:
    # Step A: Download the code from your GitHub repository onto the cloud computer
    - name: Check out the code
      uses: actions/checkout@v4

    # Step B: Log into your Docker Hub account using your saved secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step C: Build the Docker image and push it to Docker Hub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # Replace 'your-docker-username' below with your actual Docker Hub username
        tags: meghanank/my-first-webpage:latest